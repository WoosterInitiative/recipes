[project]
name = "recipes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12.13,<4.0.0",
  "asgiref>=3.8.1,<4.0.0",
  "beautifulsoup4>=4.13.4,<5.0.0",
  "bleach>=6.2.0,<7.0.0",
  "crispy-bootstrap4>=2025.6,<2026.0",
  "cryptography>=44.0.1,<44.1",
  "django-allauth>=65.3.1,<65.4",
  "django-annoying>=0.10.8,<0.11.0",
  "django-auth-ldap>=5.2.0,<6.0.0",
  "django-cleanup>=9.0.0,<10.0.0",
  "django-cors-headers>=4.7.0,<5.0.0",
  "django-crispy-forms>=2.4,<3.0",
  "django-debug-toolbar>=5.2.0,<6.0.0",
  "django-hcaptcha>=0.2.0,<0.3.0",
  "django-js-reverse",
  "django-oauth-toolkit>=3.0.1,<4.0.0",
  "django-prometheus>=2.4.0,<3.0.0",
  "django-scopes>=2.0.0,<3.0.0",
  "django-storages[s3]>=1.14.6,<2.0.0",
  "django-tables2>=2.7.5,<3.0.0",
  "django-treebeard>=4.7.1,<5.0.0",
  "django-webpack-loader>=3.2.1,<4.0.0",
  "django>=4.2.22,<4.3",
  "djangorestframework>=3.16.0,<4.0.0",
  "drf-writable-nested>=0.7.2,<0.8.0",
  "gunicorn>=23.0.0,<24.0.0",
  "icalendar>=6.3.1,<7.0.0",
  "isodate>=0.7.2,<0.8.0",
  "jinja2>=3.1.6,<4.0.0",
  "lxml>=5.4.0,<6.0.0",
  "markdown>=3.8.2,<4.0.0",
  "pillow>=11.2.1,<12.0.0",
  "psycopg2-binary>=2.9.10,<3.0.0",
  "pyppeteer>=2.0.0,<3.0.0",
  "python-dotenv>=1.1.0,<2.0.0",
  "python-ldap>=3.4.4",
  "pytubefix>=9.2.0,<10.0.0",
  "recipe-scrapers>=15.8.0,<16.0.0",
  "redis>=6.2.0,<7.0.0",
  "requests>=2.32.4,<3.0.0",
  "webdavclient3>=3.14.6,<4.0.0",
  "whitenoise>=6.9.0,<7.0.0",
]
dynamic = ["version"]

[dependency-groups]
dev = [
  "autopep8>=2.3.2",
  "commitizen>=4.8.3",
  "deptry>=0.23.0",
  "flake8>=7.2.0",
  "yapf>=0.43.0",
]
test = [
  "mock>=5.2.0",
  "pytest-asyncio>=1.0.0",
  "pytest-cov>=6.2.1",
  "pytest-django>=4.11.1",
  "pytest-factoryboy>=2.7.0",
  "pytest-html>=4.1.1",
  "pytest-xdist>=3.7.0",
  # pytest>=8.4 introduces a change that breaks pytest-factoryboy
  # * https://github.com/pytest-dev/pytest-factoryboy/issues/232 should fix it
  "pytest>=8.0.0,<8.4",
  "pytz>=2025.2",
]

[tool.deptry]
extend_exclude = ["cookbook/tests", "recipes/tests"]

[tool.deptry.per_rule_ignores]
DEP002 = [
  "crispy-bootstrap4",
  "cryptography",
  "django-cleanup",
  "django-cors-headers",
  "django-crispy-forms",
  "django-debug-toolbar",
  "gunicorn",
  "psycopg2-binary",
  "django-webpack-loader",
  "whitenoise",
]

[tool.isort]
multi_line_output = 5
skip = [".gitignore", ".dockerignore"]
line_length = 179

[tool.pytest.ini_options]
testpaths = ["*/tests*"]

[tool.setuptools]
packages = ["cookbook", "recipes"]

[tool.uv.sources]
django-js-reverse = { git = "https://github.com/BITSOLVER/django-js-reverse", rev = "071e304fd600107bc64bbde6f2491f1fe049ec82" }

[tool.yapf]
column_limit = 179
based_on_style = "pep8"
DISABLE_ENDING_COMMA_HEURISTIC = false
COALESCE_BRACKETS = true
DEDENT_CLOSING_BRACKETS = true
FORCE_MULTILINE_DICT = false

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
major_version_zero = true
